<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>The Impostor - Word Game</title>
  <link rel="icon" type="image/png" href="./app-icon.png">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- YouTube Playables SDK (Mandatory: First Script in Head) -->
  <script src="https://www.youtube.com/game_api/v1"></script>

  <!-- YouTube Playables Bridge & Lifecycle Handler -->
  <script src="./assets/yt-playables.js"></script>

  <!-- Local Self-Contained Vector Icons (100% Offline, No External CDN) -->
  <style>
    @font-face {
      font-family: 'Material Symbols Outlined';
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url('./assets/material-symbols-outlined.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Material Symbols Rounded';
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url('./assets/material-symbols-rounded.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Material Symbols Sharp';
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url('./assets/material-symbols-sharp.woff2') format('woff2');
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'liga';
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 100vh;
      background-color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.4);
    }
    @media (max-width: 500px) {
      #app {
        max-width: 100%;
        max-height: 100%;
        box-shadow: none;
      }
    }
  </style>

  <!-- Game Scripts & Styles -->
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" href="./assets/index.css">
</head>

<body>
  <div id="app"></div>
</body>

</html>
